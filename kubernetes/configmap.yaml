apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Node01 Home Lab</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;

                font-family: Arial, sans-serif;
                color: white;
                text-align: center;

                background: linear-gradient(-45deg, #0f172a, #172554, #0f766e, #111827);
                background-size: 400% 400%;

                animation: backgroundMove 12s ease infinite;
            }

            .container {
                padding: 40px;
                animation: fadeIn 1.5s ease;
            }

            h1 {
                font-size: 3rem;
                margin-bottom: 10px;
            }

            .server {
                display: inline-block;
                margin: 25px;
                padding: 15px 25px;

                border: 1px solid #38bdf8;
                border-radius: 10px;

                box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);

                animation: float 3s ease-in-out infinite;
            }

            .status {
                color: #4ade80;
            }

            .status::before {
                content: "●";
                margin-right: 8px;

                animation: pulse 1.5s infinite;
            }

            .technologies {
                margin-top: 30px;
            }

            .badge {
                display: inline-block;

                margin: 6px;
                padding: 10px 15px;

                background: rgba(255, 255, 255, 0.1);
                border-radius: 8px;

                transition: transform 0.3s, background 0.3s;
            }

            .badge:hover {
                transform: translateY(-5px);
                background: rgba(255, 255, 255, 0.2);
            }

            .terminal {
                margin: 35px auto 0;
                max-width: 500px;
                padding: 20px;

                text-align: left;
                font-family: monospace;

                background: #020617;
                border-radius: 10px;
            }

            .prompt {
                color: #4ade80;
            }

            .cursor {
                display: inline-block;
                width: 8px;
                height: 15px;
                background: white;

                animation: blink 1s infinite;
            }

            @keyframes backgroundMove {
                0% {
                    background-position: 0% 50%;
                }

                50% {
                    background-position: 100% 50%;
                }

                100% {
                    background-position: 0% 50%;
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes float {
                0%, 100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-10px);
                }
            }

            @keyframes pulse {
                0%, 100% {
                    opacity: 1;
                }

                50% {
                    opacity: 0.3;
                }
            }

            @keyframes blink {
                0%, 50% {
                    opacity: 1;
                }

                51%, 100% {
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body>

        <div class="container">

            <h1>Node01 Home Lab</h1>

            <p>My Linux, Cloud & DevOps learning server.</p>

            <div class="server">
                <strong>node01</strong>
                <p class="status">Server Online</p>
            </div>

            <div class="technologies">

                <span class="badge">Ubuntu</span>
                <span class="badge">Nginx</span>
                <span class="badge">Docker</span>
                <span class="badge">Ansible</span>
                <span class="badge">Kubernetes</span>

            </div>

            <div class="terminal">
                <span class="prompt">peter@node01:~$</span>
                echo "Hello from Node01"<br><br>

                Hello from Node01<br><br>

                <span class="prompt">peter@node01:~$</span>
                <span class="cursor"></span>
            </div>

        </div>

    </body>
    </html>
kind: ConfigMap
metadata:
  name: node01-website
